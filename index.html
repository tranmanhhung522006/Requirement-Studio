<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Requirement Studio</title><link rel="stylesheet" href="./src/styles.css"></head>
<body><a class="skip" href="#main">Skip to workspace</a>
<aside><div class="brand"><span class="brandmark">R</span><div>Requirement Studio<small>Personal workspace</small></div></div>
<nav aria-label="Workspace"><button data-view="register" aria-current="page">Requirements</button><button data-view="trace">Traceability matrix</button><button data-view="quality">Quality review</button><button data-view="history">Version history</button><button data-view="report">Specification</button></nav>
<div class="sidefoot"><span class="dot"></span> Local workspace <small>Data stays in this browser.</small></div></aside>
<main id="main" tabindex="-1"><header><div class="workspace"><label for="project">Workspace</label><input id="project" maxlength="120" aria-label="Workspace name"></div><div class="actions"><button id="sample">Load sample</button><button id="reset">New workspace</button><button id="import">Import JSON</button><button id="backup">Backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="form"><div class="dialog-head"><div><small id="record-id"></small><h2 id="editor-title">Edit artifact</h2></div><button type="button" id="close" aria-label="Close editor">Close</button></div><div id="form-fields"></div><p id="form-error" role="alert"></p><footer><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save artifact</button></footer></form></dialog>
<script type="module" src="./src/app.mjs"></script></body></html>
