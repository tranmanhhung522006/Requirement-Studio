name: Domain tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.mjs && node --check src/professional.mjs && node --check src/i18n.mjs && node --check src/export.mjs
      - run: npm test
